name: Build APK Automatically

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract ZIP automatically
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" \
            ! -path "./node_modules/*" | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in the repository."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p /tmp/extracted-project
          unzip -oq "$ZIP_FILE" -d /tmp/extracted-project

          PACKAGE_FILE=$(find /tmp/extracted-project \
            -type f -name package.json \
            ! -path "*/node_modules/*" | head -n 1 || true)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")

          cp -a "$PROJECT_DIR"/. .

          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html

          echo "ZIP extracted successfully."

      - name: Install project dependencies
        run: npm install

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Android
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daftar-Al-Aqarat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
